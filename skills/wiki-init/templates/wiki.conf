# .claude/wiki.conf -- configuration of the product-os wiki hooks. PARSED line by line, never sourced.
# Without this file the wiki hooks do nothing. Lines: key=value, '#' starts a comment.

# Where the wiki lives, relative to the repository root.
wiki_dir={{wiki_dir}}

# Language of the hook messages: en | ru
lang={{lang}}

# Code roots (space-separated prefixes). A change under them with no wiki change triggers the nudge.
watch={{watch}}

# Optional: only these extensions count as code (space-separated, no dot). Empty = every file.
code_ext={{code_ext}}

# Optional in-code README nudge.
#   per_child: <root>/<child>/** -> <root>/<child>/README.md ; <root>/<file> -> <root>/README.md
#   flat:      <dir>/**          -> <dir>/README.md
readme_per_child={{readme_per_child}}
readme_flat={{readme_flat}}

# Digest budget (bytes / lines). The whole digest must stay under ~8 KB: Claude Code drops larger hook output.
focus_bytes=2600
shipped_lines=6
log_titles=4
total_bytes=6500
